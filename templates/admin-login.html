

<!DOCTYPE html>

<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="admin-login-page">

<main class="admin-login-shell">
    <section class="admin-login-card">
        <div class="admin-login-header">
            <p class="admin-eyebrow">Digital Logbook</p>
            <h1>Admin Login</h1>
            <p>Sign in to manage users and review logbook activity.</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="admin-message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        {% if error %}
            <p class="admin-message">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}" class="admin-login-form">

            <label for="username">Admin Username</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Enter admin username"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <button type="submit">Sign in to dashboard</button>
        </form>

        <a class="admin-back-link" href="{{ url_for('home') }}">Back to home</a>
    </section>
</main>

</body>
</html>
