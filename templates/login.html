<!DOCTYPE html>
<html>

<head>
    <title>Visitor Check-in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="form-container">
    <div class="login-brand">
        <img src="{{ url_for('static', filename='swechalogo.png') }}"
             alt="Swecha Andhra Pradesh logo">
    </div>
    <h1>Visitor Check-in</h1>
    <p class="form-intro">Enter your Check-in ID to start your visit.</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="checkin_id">Check-in ID *</label>
        <input
            type="text"
            id="checkin_id"
            name="checkin_id"
            placeholder="Enter your Check-in ID"
            value="{{ checkin_id }}"
            required
        >

        <label for="purpose">Purpose of Visit</label>
        <input
            type="text"
            id="purpose"
            name="purpose"
            placeholder="Enter purpose of visit"
            required
        >

        <button type="submit">Check In</button>
    </form>

    <p>
        New user?
        <a href="/register">Register here</a>
    </p>

    <a href="{{ url_for('home') }}">
        <button type="button">Back to Home</button>
    </a>
</div>
</body>

</html>
