<!DOCTYPE html>
<html>
<head>
    <title>Complete Your Visit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="form-container">
    <div class="login-brand">
        <img src="{{ url_for('static', filename='swechalogo.png') }}"
             alt="Swecha Andhra Pradesh logo">
    </div>

    <h1>Complete Your Visit</h1>
    <p class="form-intro">Before leaving, please record what you worked on or learned.</p>

    <form method="POST" action="{{ url_for('logout') }}">
        {% if visit_token %}
        <input type="hidden" name="visit_token" value="{{ visit_token }}">
        {% endif %}
        <label for="work_done">Work / Learning Completed</label>
        <textarea id="work_done" name="work_done" rows="5" placeholder="Describe your work or learning" required></textarea>
        <button type="submit">Check Out</button>
    </form>
</div>
</body>
</html>
